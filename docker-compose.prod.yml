version: "3.8"

services:
  backend:
    build:
      context: ./backend_code
      dockerfile: Dockerfile
    image: rakshak-backend:latest
    container_name: rakshak-backend
    env_file:
      - .env.prod
    ports:
      - "3002:3002"
    restart: always
    networks:
      - rakshak-net

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        # used at build-time by Vite
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://52.0.67.228:3002}
    image: rakshak-frontend:latest
    container_name: rakshak-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: always
    networks:
      - rakshak-net

networks:
  rakshak-net:
    driver: bridge